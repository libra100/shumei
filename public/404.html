<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 找不到頁面 - 神慈秀明會</title>
    <!-- 即時檢查並自動將舊路徑轉向新資料夾 -->
    <script src="/js/redirect.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/logo.png" type="image/png">
    
    <style>
      :root {
        --bg-gradient: radial-gradient(circle at top, #202736 0%, #0f131a 100%);
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.12);
        --text-primary: #f0f4f8;
        --text-secondary: #94a3b8;
        --accent-orange: #ffa100;
        --accent-cyan: #00F3FF;
        --accent-green: #52b788;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: var(--bg-gradient);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .error-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 24px;
        padding: 48px 32px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .error-badge {
        display: inline-block;
        font-size: 80px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #ffa100 0%, #ff6b00 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text-primary);
      }

      p {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .nav-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .nav-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.2s ease;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .nav-btn.primary {
        background: linear-gradient(135deg, #ffa100 0%, #ff8800 100%);
        color: #111;
        border: none;
      }

      .nav-btn.primary:hover {
        box-shadow: 0 8px 20px rgba(255, 161, 0, 0.35);
      }

      .arrow {
        font-size: 18px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="error-badge">404</div>
      <h1>找不到此頁面</h1>
      <p>您所連結的頁面可能已被移動或重新分類。請選擇下方模組前往需要的系統：</p>
      
      <div class="nav-group">
        <a href="/" class="nav-btn primary">
          <span>🏠 系統首頁 / 登入</span>
          <span class="arrow">→</span>
        </a>
        <a href="/youth/list.html" class="nav-btn">
          <span>👥 青年部名單與系統</span>
          <span class="arrow">→</span>
        </a>
        <a href="/farm/natural-farm.html" class="nav-btn">
          <span>🌾 自然農法社群平台</span>
          <span class="arrow">→</span>
        </a>
        <a href="/seed/change.html" class="nav-btn">
          <span>🌱 種子交換會系統</span>
          <span class="arrow">→</span>
        </a>
      </div>
    </div>
  </body>
</html>

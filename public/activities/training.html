<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>研修營運與輪調排班系統 - 神慈秀明會</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffa100">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="秀明青年">
  <link rel="icon" href="/logo.png" type="image/png">
  <script src="/js/pwa.js" defer></script>

  <!-- Google Fonts & Bootstrap 5 & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/app.css" />

  <!-- Firebase compatibility libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

  <style>
    .training-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 999;
    }
    .duty-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
    }
    .duty-clean {
      background: rgba(0, 243, 255, 0.15);
      color: #00F3FF;
      border: 1px solid rgba(0, 243, 255, 0.3);
    }
    .duty-cook {
      background: rgba(255, 161, 0, 0.15);
      color: #ffa100;
      border: 1px solid rgba(255, 161, 0, 0.3);
    }
    .tab-pills {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
    }
    .tab-pill {
      flex: 1;
      text-align: center;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s ease;
      user-select: none;
    }
    .tab-pill.active {
      background: linear-gradient(135deg, rgba(255, 161, 0, 0.3), rgba(255, 107, 0, 0.3));
      color: #fff;
      border: 1px solid #ffa100;
      box-shadow: 0 0 8px rgba(255, 161, 0, 0.3);
    }
    .matrix-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }
    .matrix-table th, .matrix-table td {
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      vertical-align: middle;
    }
    .matrix-table th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-weight: 600;
      text-align: center;
    }
    .personal-card {
      border-left: 3px solid #00F3FF;
      background: rgba(255, 255, 255, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .personal-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 243, 255, 0.15);
    }
    .visit-card {
      border-left: 3px solid #52b788;
      background: rgba(255, 255, 255, 0.03);
    }

    @media (max-width: 768px) {
      body {
        padding-bottom: 75px !important;
      }
      .glass-card {
        padding: 12px 14px !important;
        margin-bottom: 12px !important;
      }
    }

    /* 全局置底導覽列 (確保桌面與行動版均常駐置底) */
    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      top: auto !important;
      left: 0 !important;
      width: 100% !important;
      display: flex !important;
      justify-content: space-around !important;
      align-items: center !important;
      background: rgba(10, 15, 30, 0.95) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
      z-index: 1000 !important;
      box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5) !important;
      padding: 6px 0 !important;
      overflow-x: auto !important;
    }
    .bottom-nav-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      color: #94a3b8 !important;
      text-decoration: none !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      min-width: 48px !important;
      padding: 2px 4px !important;
      background: none !important;
      border: none !important;
      transition: all 0.2s ease !important;
    }
    .bottom-nav-item:hover, .bottom-nav-item.active {
      color: #00F3FF !important;
      font-weight: 600 !important;
      filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.6)) !important;
    }
    .bottom-nav-item svg {
      width: 20px !important;
      height: 20px !important;
      margin-bottom: 2px !important;
      fill: currentColor !important;
    }
    .training-header-nav a, .training-header-nav button {
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
      background: none;
      border: none;
    }
    .training-header-nav a:hover, .training-header-nav button:hover, .training-header-nav a.active {
      color: #00F3FF;
      background: rgba(0, 243, 255, 0.1);
    }
  </style>
</head>
<body style="background: radial-gradient(circle at top, #1c2331 0%, #0d1117 100%); min-height: 100vh; padding-bottom: 85px; color: var(--text-main);">

  <!-- Top Header -->
  <header class="training-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <a href="/" class="text-decoration-none">
        <img src="/logo.png" alt="Logo" style="width: 30px; height: 30px; border-radius: 50%;">
      </a>
      <div>
        <h1 class="h6 mb-0 text-white font-weight-bold" style="font-size: 14px;">研修營運與輪調排班</h1>
      </div>
    </div>

    <!-- Desktop Center Navigation -->
    <div class="training-header-nav d-none d-lg-flex align-items-center gap-1">
      <a href="/youth/admin.html">青年名單</a>
      <a href="/scheduling/">值班排程</a>
      <a href="/scheduling/front.html">現場櫃檯</a>
      <a href="/youth/group.html">分組</a>
      <a href="/youth/seminar.html">座談會</a>
      <a href="/activities/training.html" class="active">研修排班</a>
      <a href="/activities/jyorei.html">靈線淨靈</a>
      <a href="/activities/events.html">活動發布</a>
      <a href="/farm/natural-farm.html" style="color: #52b788;">🌾 農法</a>
      <button onclick="handleSignOut()">登出</button>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-secondary-custom py-1 px-2 interactive" onclick="exportTrainingExcel()" style="font-size: 11px;">
        <i class="fa-solid fa-file-excel me-1 text-success"></i>匯出
      </button>
      <button class="btn btn-sm btn-primary-custom py-1 px-2 interactive" onclick="openConfigModal()" style="font-size: 11px;">
        <i class="fa-solid fa-gear me-1"></i>設定
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container-fluid px-2 px-md-3 py-2 py-md-3" style="max-width: 1400px;">
    
    <!-- Navigation Tabs (Compact) -->
    <div class="tab-pills mb-2 mb-md-3">
      <div class="tab-pill active" onclick="switchTrainingTab('shifts')">
        <i class="fa-solid fa-broom me-1"></i> 執事排班大表
      </div>
      <div class="tab-pill" onclick="switchTrainingTab('my-schedule')">
        <i class="fa-solid fa-user-clock me-1"></i> 個人任務查詢
      </div>
      <div class="tab-pill" onclick="switchTrainingTab('visitation')">
        <i class="fa-solid fa-map-location-dot me-1"></i> 家庭拜訪計劃表
      </div>
    </div>

    <!-- TAB 1: 執事排班大表 -->
    <section id="tab-shifts">
      <div class="glass-card noise-overlay p-2 p-md-3 mb-2 mb-md-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <div class="d-flex flex-wrap align-items-center gap-2">
            <h2 class="h6 text-white mb-0" id="display-camp-name" style="font-weight: 700;">2026 青年特別研修會</h2>
            <span class="badge bg-secondary" id="display-camp-days" style="font-size: 11px;">3 天</span>
            <span class="badge bg-dark border border-secondary text-info" id="display-member-count" style="font-size: 11px;">0 人</span>
            <span class="text-muted d-none d-md-inline" style="font-size: 11px;"><i class="fa-solid fa-chalkboard-user me-1 text-success"></i><strong id="display-teachers" class="text-light">日籍先生、帶隊幹部</strong></span>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary-custom py-1 px-2 interactive" onclick="autoGenerateSchedule()" style="font-size: 12px;">
              <i class="fa-solid fa-wand-magic-sparkles me-1"></i> 自動輪調
            </button>
          </div>
        </div>

        <!-- Filter / View Controls (Compact Inline) -->
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
          <div class="btn-group btn-group-sm" role="group">
            <input type="radio" class="btn-check" name="dayFilter" id="day-all" checked onchange="renderShiftMatrix('all')">
            <label class="btn btn-outline-secondary py-0 px-2 text-light" for="day-all" style="font-size: 11px;">全部</label>
            <span id="day-filter-container" class="d-flex gap-1 ms-1"></span>
          </div>
        </div>

        <!-- Matrix Table Container (Scrollable within viewport) -->
        <div class="table-responsive rounded-3 border border-secondary border-opacity-25" style="max-height: calc(100vh - 200px); overflow-y: auto;">
          <table class="matrix-table" id="matrix-table">
            <thead style="position: sticky; top: 0; z-index: 10; background: #0f172a;">
              <tr>
                <th style="min-width: 80px; padding: 6px 8px;">日期時段</th>
                <th style="min-width: 120px; padding: 6px 8px;">執事項目</th>
                <th style="min-width: 60px; padding: 6px 8px;">人數</th>
                <th style="padding: 6px 8px;">負責學員 (自動平衡分配)</th>
              </tr>
            </thead>
            <tbody id="matrix-tbody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TAB 2: 個人任務查詢 -->
    <section id="tab-my-schedule" class="d-none">
      <div class="glass-card noise-overlay p-2 p-md-3 mb-2 mb-md-3">
        <h2 class="h6 text-white mb-1">個人研修任務卡</h2>
        <p class="text-muted small mb-2" style="font-size: 12px;">輸入您的姓名，即刻查詢您每日的打掃與炊事煮飯職責：</p>
        
        <div class="row g-2 align-items-center mb-3" style="max-width: 450px;">
          <div class="col-8 col-md-9">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-dark text-muted border-secondary py-1"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input type="text" id="personal-search-name" class="form-control bg-dark text-white border-secondary py-1" placeholder="輸入姓名 (例如: 陳大明)..." onkeyup="if(event.key==='Enter') searchPersonalTasks()">
            </div>
          </div>
          <div class="col-4 col-md-3">
            <button class="btn btn-sm btn-primary-custom w-100 py-1 interactive" onclick="searchPersonalTasks()">查詢</button>
          </div>
        </div>

        <div id="personal-results" class="row g-2">
          <!-- Dynamically filled with day-by-day task cards -->
          <div class="col-12 text-center text-muted py-4">
            <i class="fa-solid fa-clipboard-user fa-2x mb-2 opacity-50"></i>
            <p style="font-size: 13px;">請輸入姓名查詢您的專屬研修日程排班</p>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 3: 家庭拜訪計劃表 -->
    <section id="tab-visitation" class="d-none">
      <div class="glass-card noise-overlay p-2 p-md-3 mb-2 mb-md-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <div>
            <h2 class="h6 text-white mb-0">信徒家庭拜訪計劃表</h2>
            <p class="text-muted small mb-0" style="font-size: 11px;">指派隨行青年小組與日籍老師，附帶 Google Maps 導航與快速聯繫</p>
          </div>
          <button class="btn btn-sm btn-primary-custom py-1 px-2 interactive" onclick="openAddVisitModal()" style="font-size: 12px;">
            <i class="fa-solid fa-plus me-1"></i> 新增拜訪排程
          </button>
        </div>

        <div id="visitation-list" class="row g-2">
          <!-- Dynamically populated visit cards -->
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Global Navigation Bar (Full Portal Links) -->
  <nav class="bottom-nav">
    <a href="/youth/admin.html" class="bottom-nav-item" title="青年名單">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      <span>名單</span>
    </a>
    <a href="/scheduling/" class="bottom-nav-item" title="值班排程">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      <span>排程</span>
    </a>
    <a href="/scheduling/front.html" class="bottom-nav-item" title="現場自助櫃檯">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      <span>櫃檯</span>
    </a>
    <a href="/youth/group.html" class="bottom-nav-item" title="小組分組">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>

    </a>
    <a href="/youth/seminar.html" class="bottom-nav-item" title="座談會">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      <span>座談會</span>
    </a>
    <a href="/activities/training.html" class="bottom-nav-item active" title="研修營運與輪調排班">
      <svg viewBox="0 0 24 24"><path d="M19.36 10.04l-7.36-7.36-7.36 7.36 1.41 1.41L11 6.41V20h2V6.41l5.05 5.04z"/></svg>
      <span>研修</span>
    </a>
    <a href="/activities/jyorei.html" class="bottom-nav-item" title="靈線淨靈打卡">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
      <span>淨靈</span>
    </a>
    <a href="/activities/events.html" class="bottom-nav-item" title="活動發布與集會">
      <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg>
      <span>活動</span>
    </a>
    <a href="/farm/natural-farm.html" class="bottom-nav-item" title="自然農法專區" style="color: #52b788;">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      <span>農法</span>
    </a>
    <button onclick="handleSignOut()" class="bottom-nav-item" title="登出系統">
      <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
      <span>登出</span>
    </button>

  <!-- Modal: 研修梯次設定與名單匯入 -->
  <div class="modal fade" id="configModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-card noise-overlay border-0 p-4">
        <div class="modal-header border-0 pb-2">
          <h5 class="modal-title text-white font-weight-bold">研修模式設定與成員管理</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label text-light small">研修活動名稱</label>
              <input type="text" id="cfg-camp-name" class="form-control bg-dark text-white border-secondary" value="2026 青年特別研修會">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label text-light small">研修天數 (1~7天)</label>
              <input type="number" id="cfg-camp-days" class="form-control bg-dark text-white border-secondary" min="1" max="7" value="3">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label text-light small">每日組別數</label>
              <input type="number" id="cfg-groups" class="form-control bg-dark text-white border-secondary" min="1" max="6" value="4">
            </div>
            <div class="col-12">
              <label class="form-label text-light small">日籍老師 / 指導幹部名冊 (逗號分隔)</label>
              <input type="text" id="cfg-teachers" class="form-control bg-dark text-white border-secondary" value="中島先生, 田中老師, 林部長">
            </div>
            <div class="col-12">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label text-light small mb-0">參與學員名冊 (換行或逗號分隔)</label>
                <button type="button" class="btn btn-sm btn-outline-info rounded-pill py-0 px-2" onclick="importFromYouthMembers()">
                  <i class="fa-solid fa-cloud-arrow-down me-1"></i> 從青年名冊庫自動載入
                </button>
              </div>
              <textarea id="cfg-members" class="form-control bg-dark text-white border-secondary" rows="6" placeholder="請填寫或貼上學員姓名..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-2">
          <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">關閉</button>
          <button type="button" class="btn btn-primary-custom interactive" onclick="saveTrainingConfig()">儲存設定並套用</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: 新增/編輯拜訪排程 -->
  <div class="modal fade" id="visitModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-card noise-overlay border-0 p-4">
        <div class="modal-header border-0 pb-2">
          <h5 class="modal-title text-white font-weight-bold" id="visitModalTitle">新增家庭拜訪排程</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label text-light small mb-0">拜訪信徒/青年姓名</label>
                <button type="button" class="btn btn-sm btn-outline-warning rounded-pill py-0 px-2" onclick="openMemberPickerForVisit()">
                  <i class="fa-solid fa-address-book me-1"></i> 選擇名冊成員
                </button>
              </div>
              <input type="text" id="visit-name" class="form-control bg-dark text-white border-secondary" placeholder="姓名" required>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label text-light small">聯絡電話</label>
              <input type="tel" id="visit-phone" class="form-control bg-dark text-white border-secondary" placeholder="0912-345-678">
            </div>
            <div class="col-12">
              <label class="form-label text-light small">通訊地址 (將自動支援 Google 地圖一鍵導航)</label>
              <input type="text" id="visit-address" class="form-control bg-dark text-white border-secondary" placeholder="請輸入完整地址，如：台中市西屯區...">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label text-light small">拜訪日期</label>
              <input type="date" id="visit-date" class="form-control bg-dark text-white border-secondary">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label text-light small">拜訪時段</label>
              <input type="text" id="visit-time" class="form-control bg-dark text-white border-secondary" placeholder="如 14:00 - 15:30">
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label text-light small">同行指導老師/幹部</label>
              <input type="text" id="visit-teacher" class="form-control bg-dark text-white border-secondary" placeholder="如: 中島先生">
            </div>
            <div class="col-12">
              <label class="form-label text-light small">隨行青年學員小組 (逗號分隔)</label>
              <input type="text" id="visit-escorts" class="form-control bg-dark text-white border-secondary" placeholder="如: 王小明, 陳雅婷, 李志成">
            </div>
            <div class="col-12">
              <label class="form-label text-light small">家庭狀況與注意事項備註</label>
              <textarea id="visit-notes" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="備註家庭近況、是否供奉光明祿、希望加強淨靈部位..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-2">
          <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary-custom interactive" onclick="saveVisitationPlan()">儲存拜訪排程</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: 從名冊勾選人員的選擇器 -->
  <div class="modal fade" id="memberPickerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card noise-overlay border-0 p-3">
        <div class="modal-header border-0 pb-1">
          <h6 class="modal-title text-white">點選帶入成員資料</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-2">
          <input type="text" id="picker-search" class="form-control form-control-sm bg-dark text-white border-secondary mb-2" placeholder="搜尋姓名..." oninput="filterMemberPicker(this.value)">
          <div id="picker-list" class="list-group list-group-flush" style="max-height: 300px; overflow-y: auto;">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle & Training Logic Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/training.js"></script>
  <script>
    function handleSignOut() {
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().signOut().then(function() {
          window.location.href = '/';
        }).catch(function() {
          window.location.href = '/';
        });
      } else {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>淨靈統計與靈線願景儀表板 - 神慈秀明會</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffa100">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="秀明青年">
  <link rel="icon" href="/logo.png" type="image/png">
  <meta name="view-transition" content="same-origin">
  <script src="/js/pwa.js" defer></script>
  <script src="/js/unified-nav.js" defer></script>

  <!-- Google Fonts & Bootstrap 5 & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/app.css" />

  <!-- Firebase compatibility libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>

  <style>
    /* 緊湊自適應 Header */
    .jyorei-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 999;
    }
    
    /* 自適應願景儀表板：手機版為精簡橫幅，桌面版為全尺寸卡片 */
    .vision-card {
      background: radial-gradient(circle at center, rgba(255, 161, 0, 0.12) 0%, rgba(15, 23, 42, 0.85) 100%);
      border: 1px solid rgba(255, 161, 0, 0.3);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      padding: 14px 18px;
    }
    .counter-number {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #ffa100 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-feature-settings: "tnum";
    }
    @media (min-width: 992px) {
      .counter-number {
        font-size: 48px;
      }
      .vision-card {
        padding: 24px 20px;
        text-align: center;
      }
    }

    /* 緊湊靈線列表與表單列 */
    .lineage-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      transition: all 0.2s ease;
    }
    .lineage-row:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(0, 243, 255, 0.3);
    }
    .quick-btn {
      padding: 2px 7px;
      font-size: 11px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .quick-btn:hover {
      background: rgba(255, 161, 0, 0.3);
      border-color: #ffa100;
      color: #ffa100;
    }
    .num-input {
      width: 60px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      padding: 4px;
    }

    /* 手機版滾動空間最小化 */
    @media (max-width: 768px) {
      body {
        padding-bottom: 75px !important;
      }
      .glass-card {
        padding: 12px 14px !important;
        margin-bottom: 12px !important;
      }
      .form-label {
        font-size: 12px !important;
        margin-bottom: 4px !important;
      }
    }

    /* 全局置底導覽列 (確保桌面與行動版均常駐置底) */
    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      top: auto !important;
      left: 0 !important;
      width: 100% !important;
      display: flex !important;
      justify-content: space-around !important;
      align-items: center !important;
      background: rgba(10, 15, 30, 0.95) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
      z-index: 1000 !important;
      box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5) !important;
      padding: 6px 0 !important;
      overflow-x: auto !important;
    }
    .bottom-nav-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      color: #94a3b8 !important;
      text-decoration: none !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      min-width: 48px !important;
      padding: 2px 4px !important;
      background: none !important;
      border: none !important;
      transition: all 0.2s ease !important;
    }
    .bottom-nav-item:hover, .bottom-nav-item.active {
      color: #00F3FF !important;
      font-weight: 600 !important;
      filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.6)) !important;
    }
    .bottom-nav-item svg {
      width: 20px !important;
      height: 20px !important;
      margin-bottom: 2px !important;
      fill: currentColor !important;
    }
    .jyorei-header-nav a, .jyorei-header-nav button {
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
      background: none;
      border: none;
    }
    .jyorei-header-nav a:hover, .jyorei-header-nav button:hover, .jyorei-header-nav a.active {
      color: #00F3FF;
      background: rgba(0, 243, 255, 0.1);
    }
  </style>
</head>
<body style="background: radial-gradient(circle at top, #1c2331 0%, #0d1117 100%); min-height: 100vh; padding-bottom: 85px; color: var(--text-main);">

  <!-- Top Header (緊湊簡約) -->
  <header class="jyorei-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <a href="/" class="text-decoration-none">
        <img src="/logo.png" alt="Logo" style="width: 30px; height: 30px; border-radius: 50%;">
      </a>
      <div>
        <h1 class="h6 mb-0 text-white font-weight-bold" style="font-size: 14px;">秀明青年</h1>
      </div>
    </div>

    <!-- Desktop Center Navigation -->
    <div class="jyorei-header-nav d-none d-lg-flex align-items-center gap-1">
      <a href="/youth/admin.html">青年名單</a>
      <a href="/scheduling/">值班排程</a>
      <a href="/scheduling/front.html">現場櫃檯</a>
      <a href="/youth/group.html">分組</a>
      <a href="/youth/seminar.html">座談會</a>
      <a href="/activities/training.html">研修排班</a>
      <a href="/activities/jyorei.html" class="active">靈線淨靈</a>
      <a href="/activities/events.html">活動發布</a>
      <a href="/farm/natural-farm.html" style="color: #52b788;">🌾 農法</a>
      <button onclick="handleSignOut()">登出</button>
    </div>

    <div class="d-flex gap-2">
      <a href="/youth/lineage.html" class="btn btn-sm btn-outline-info rounded-pill px-2 py-0 interactive" style="font-size: 11px;">
        <i class="fa-solid fa-circle-nodes me-1"></i>靈線宇宙
      </a>
    </div>
  </header>

  <main class="container px-2 px-md-3 py-2 py-md-3" style="max-width: 1200px;">

    <!-- 響應式佈局：桌面版採左右雙欄 (免滾動)，手機版採緊湊單欄 (第一屏即達) -->
    <div class="row g-3">
      
      <!-- 左欄 (桌面版) / 頂部 (手機版)：全會願景進度 Banner + 成就卡片 -->
      <div class="col-12 col-lg-5">
        
        <!-- 1. 全會實踐成果統計 (真實資料庫統計，無模擬假資料) -->
        <div class="vision-card noise-overlay mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-info text-dark px-2 py-1 font-weight-bold" style="font-size: 11px;">
              ☀️ 全會淨靈實踐統計
            </span>
            <span class="small text-muted" id="jyorei-updated-time" style="font-size: 11px;">
              即時統計中...
            </span>
          </div>

          <div class="d-flex justify-content-between align-items-baseline my-2">
            <div>
              <span class="counter-number" id="global-counter">0</span>
              <small class="text-light ms-1" style="font-size: 13px;">人次 (累計施光)</small>
            </div>
            <div class="text-end">
              <span class="badge bg-secondary py-1 px-2" id="global-logs-count">0 筆紀錄</span>
            </div>
          </div>

          <div class="row g-2 text-center pt-2 border-top border-secondary border-opacity-25 mt-2">
            <div class="col-6">
              <div class="small text-muted" style="font-size: 11px;">對信徒施光</div>
              <div class="h5 mb-0 fw-bold text-warning" id="stat-global-believers">0 <span class="small font-weight-normal text-muted" style="font-size: 11px;">人次</span></div>
            </div>
            <div class="col-6">
              <div class="small text-muted" style="font-size: 11px;">對未信徒施光</div>
              <div class="h5 mb-0 fw-bold text-success" id="stat-global-non-believers">0 <span class="small font-weight-normal text-muted" style="font-size: 11px;">人次</span></div>
            </div>
          </div>
        </div>

        <!-- 2. 個人與靈線累計成就 (桌面版常駐，手機版緊湊) -->
        <div class="glass-card noise-overlay mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom border-secondary border-opacity-25">
            <h6 class="text-white mb-0 font-weight-bold" style="font-size: 13px;">
              <i class="fa-solid fa-chart-line me-1 text-info"></i>個人與靈線累計成就
            </h6>
            <span class="badge bg-success" style="font-size: 10px;"><i class="fa-solid fa-medal me-1"></i>傳道先鋒</span>
          </div>
          
          <div class="row g-2 text-center">
            <div class="col-4 p-2 rounded-2 bg-dark border border-secondary">
              <div class="text-muted" style="font-size: 10px;">對信徒施光</div>
              <div class="text-warning font-weight-bold h6 mb-0" id="stat-believer-total">0</div>
            </div>
            <div class="col-4 p-2 rounded-2 bg-dark border border-secondary">
              <div class="text-muted" style="font-size: 10px;">對未信徒施光</div>
              <div class="text-success font-weight-bold h6 mb-0" id="stat-non-believer-total">0</div>
            </div>
            <div class="col-4 p-2 rounded-2 bg-dark border border-secondary">
              <div class="text-muted" style="font-size: 10px;">連續打卡</div>
              <div class="text-info font-weight-bold h6 mb-0" id="stat-streak">1 天</div>
            </div>
          </div>

          <!-- 近期紀錄 (桌面版展開，手機版摺疊預覽) -->
          <div class="mt-2 pt-2 border-top border-secondary border-opacity-25">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="text-muted" style="font-size: 11px;">近期打卡動態</span>
            </div>
            <div id="recent-logs" class="list-group list-group-flush rounded-2 border border-secondary" style="max-height: 140px; overflow-y: auto;">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>

      </div>

      <!-- 右欄 (桌面版) / 主要操作區 (手機版)：快速打卡與靈線成員展開 -->
      <div class="col-12 col-lg-7">
        <div class="glass-card noise-overlay">
          
          <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom border-secondary border-opacity-25">
            <h6 class="text-white mb-0 font-weight-bold" style="font-size: 14px;">
              <i class="fa-solid fa-pen-to-square me-1 text-warning"></i>今日淨靈實踐打卡
            </h6>
            <span class="text-muted small" id="today-date-text" style="font-size: 11px;">2026-09-15</span>
          </div>

          <!-- 身分選擇 (超緊湊單行) -->
          <div class="p-2 mb-2 rounded-2 bg-dark border border-secondary">
            <div class="row g-2 align-items-center">
              <div class="col-8 col-sm-9">
                <input type="text" id="reporter-name" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="輸入姓名 (例如: 蔡宗翰)..." oninput="debounceFetchLineage()" style="font-size: 13px;">
              </div>
              <div class="col-4 col-sm-3">
                <button class="btn btn-primary-custom btn-sm w-100 py-1 interactive" onclick="confirmReporterName()" style="font-size: 12px;">
                  <i class="fa-solid fa-magnifying-glass me-1"></i>載入靈線
                </button>
              </div>
            </div>
          </div>

          <!-- 本人成果 (信徒 + 未信徒) -->
          <div class="row g-2 mb-2">
            <div class="col-6">
              <div class="lineage-row d-flex justify-content-between align-items-center p-2">
                <div>
                  <strong class="text-white d-block" style="font-size: 12px;"><i class="fa-solid fa-hands-praying me-1 text-warning"></i>對「信徒」</strong>
                </div>
                <div class="d-flex align-items-center gap-1">
                  <input type="number" id="self-believer-count" class="form-control form-control-sm bg-dark text-white border-secondary num-input" min="0" value="1" oninput="calculateTotalSum()">
                  <button type="button" class="quick-btn" onclick="addCount('self-believer-count', 1)">+1</button>
                  <button type="button" class="quick-btn" onclick="addCount('self-believer-count', 2)">+2</button>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="lineage-row d-flex justify-content-between align-items-center p-2">
                <div>
                  <strong class="text-white d-block" style="font-size: 12px;"><i class="fa-solid fa-seedling me-1 text-success"></i>對「未信徒」</strong>
                </div>
                <div class="d-flex align-items-center gap-1">
                  <input type="number" id="self-non-believer-count" class="form-control form-control-sm bg-dark text-white border-secondary num-input" min="0" value="0" oninput="calculateTotalSum()">
                  <button type="button" class="quick-btn" onclick="addCount('self-non-believer-count', 1)">+1</button>
                  <button type="button" class="quick-btn" onclick="addCount('self-non-believer-count', 2)">+2</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 靈線成員清單 (可平滑滾動，限制在固定高度) -->
          <div class="mb-2">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="text-light small font-weight-bold" style="font-size: 12px;">
                我底下的靈線成員 (代為登記)：
              </span>
              <span class="badge bg-dark border border-secondary text-info" id="lineage-member-badge" style="font-size: 10px;">0 位成員</span>
            </div>

            <div id="lineage-container" style="max-height: 220px; overflow-y: auto; padding-right: 2px;">
              <div class="text-center py-3 text-muted small bg-dark bg-opacity-50 rounded-2 border border-secondary" style="font-size: 11px;">
                <i class="fa-solid fa-circle-nodes me-1 text-warning opacity-50"></i>
                輸入姓名即可自動載入您引導的靈線名單
              </div>
            </div>
          </div>

          <!-- 總結與送出按鈕列 (緊湊單行) -->
          <div class="p-2 rounded-2 bg-dark border border-warning border-opacity-50 mt-2">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div class="text-muted" style="font-size: 11px;">
                  本次小計：
                  <span class="text-warning">信徒 <strong id="sum-believers">1</strong></span>・
                  <span class="text-success">未信徒 <strong id="sum-non-believers">0</strong></span>
                </div>
                <div class="text-white font-weight-bold" style="font-size: 15px;">
                  今日總計：<span id="lineage-total-sum" class="text-warning">1</span> 人次
                </div>
              </div>
              <button class="btn btn-primary-custom btn-sm px-3 py-2 interactive font-weight-bold" onclick="submitJyoreiRecord()" style="font-size: 13px;">
                <i class="fa-solid fa-cloud-arrow-up me-1"></i>送出成果
              </button>
            </div>
          </div>

        </div>
      </div>

    </div>

  </main>

  <!-- Bootstrap Bundle & Jyorei Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/jyorei.js"></script>
  <script>
    function handleSignOut() {
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().signOut().then(function() {
          window.location.href = '/';
        }).catch(function() {
          window.location.href = '/';
        });
      } else {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>

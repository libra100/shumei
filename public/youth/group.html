<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>青年部分組 - 活動紀錄</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffa100">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="秀明青年">
    <link rel="icon" href="/logo.png" type="image/png">
    <meta name="view-transition" content="same-origin">
    <script src="/js/pwa.js" defer></script>
    <script src="/js/unified-nav.js" defer></script>
                        
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/app.css">
    <style>
      .member-activity-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        margin-bottom: 4px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        font-size: 13px;
      }
      .member-activity-item:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 15px rgba(0, 243, 255, 0.15);
        border-color: rgba(0, 243, 255, 0.4);
      }
      .activity-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
        padding: 4px;
      }
      @media (min-width: 768px) {
        .activity-grid {
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <h1 class="app-title">
        <img onclick="this.classList.toggle('zoomed')" class="logo-zoomable" src="/logo.png" alt="Logo">
        <span>秀明青年</span>
      </h1>
      <!-- Desktop navigation -->
      <div class="app-header-nav desktop-only">
        <a href="dashboard.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">總覽</a>
        <a href="admin.html" id="nav-desktop-list" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">名單</a>
        <a href="group.html" class="bottom-nav-item active" style="flex: none; flex-direction: row; gap: 4px;">分組</a>
        <a href="seminar.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">座談會</a>
        <a href="lineage.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">靈線</a>
        <a href="/farm/natural-farm.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; color: #52b788; font-weight: 600;">🌾 自然農法</a>
        <button onclick="signOut()" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; background: none; border: none;">登出</button>
      </div>
      <div style="width: 32px;"></div> <!-- Spacer -->
    </header>

    <div class="container py-2 py-md-3 px-2 px-md-3" style="max-width: 1000px;">
      <!-- Title area (Compact) -->
      <div class="d-flex justify-content-between align-items-center mb-2 mb-md-3 stagger-item">
        <div>
          <h2 style="font-weight: 600; color: var(--text-main); font-size: 1.15rem; margin-bottom: 2px;">青年分組與活動登錄</h2>
          <p class="text-muted" style="font-size: 12px; margin-bottom: 0;">點擊成員以登錄或查看當月活動參與狀態</p>
        </div>
        <button type="button" class="btn btn-sm btn-outline-light interactive" onclick="openManageActivityModal()" style="border-radius: 10px; font-size: 13px; border: 1px solid var(--glass-border); color: var(--text-main);">
          ⚙️ 管理活動項目
        </button>
      </div>

      <!-- Accordion Body -->
      <div class="accordion group-accordion stagger-item" style="animation-delay: 100ms;" id="body">
        <!-- Dynamically loaded group accordions -->
      </div>
    </div>

    <!-- Activity Logging Modal (logModal) -->
    <div class="modal fade" id="logModal" tabindex="-1" aria-labelledby="logModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-card noise-overlay" style="border: none; padding: 20px;">
          <div class="modal-header border-0 pb-0">
            <div>
              <h5 class="modal-title" id="logModalLabel" style="font-weight: 600; color: var(--text-main); font-size: 20px;">成員姓名</h5>
              <div class="badge bg-warning text-dark mt-1" id="monthBadge" style="font-size: 12px; font-weight: 500;">當月份活動登錄</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-3">
            <h4 id="month" class="text-center d-none" style="font-weight: 600; color: var(--primary-dark);">當月月分</h4>
            
            <!-- 動態渲染自 Firestore info/activity_items 的活動項目 -->
            <div class="list-group border-0 gap-2" id="activityItemsContainer"></div>
          </div>
          <div class="modal-footer border-0 pt-0 justify-content-end">
            <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">取消</button>
            <button id="btn_up" type="button" class="btn btn-primary-custom interactive">
              更新紀錄
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Manage Activity Items Modal -->
    <div class="modal fade" id="manageActivityModal" tabindex="-1" aria-labelledby="manageActivityModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-card noise-overlay" style="border: none; padding: 20px;">
          <div class="modal-header border-0 pb-1">
            <div>
              <h5 class="modal-title" id="manageActivityModalLabel" style="font-weight: 600; color: var(--text-main);">⚙️ 管理活動登錄項目</h5>
              <div class="text-muted" style="font-size: 12px;">直接以中文名稱儲存於資料庫 <code>info/activity_items</code>，可隨時增減</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-3">
            <div class="input-group mb-3">
              <input type="text" id="newActivityNameInput" class="form-control" placeholder="輸入新活動名稱（例如：讀書會）">
              <button type="button" class="btn btn-primary-custom interactive" onclick="addNewActivityItem()">＋ 新增項目</button>
            </div>
            <div class="list-group border-0 gap-2" id="manageActivityListContainer"></div>
          </div>
          <div class="modal-footer border-0 pt-1">
            <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">關閉</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden elements for script compatibility -->
    <div style="display: none;">
      <div name="input-area"></div>
      <div id="staticBackdrop"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="/js/group.js"></script>
  </body>
</html>

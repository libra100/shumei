<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>青年部分組 - 活動紀錄</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffa100">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/logo.png" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/app.css">
    <style>
      .member-activity-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .member-activity-item:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        background: white;
      }
      .activity-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <h1 class="app-title">
        <img onclick="this.classList.toggle('zoomed')" class="logo-zoomable" src="/logo.png" alt="Logo">
        <span>青年部分組</span>
      </h1>
      <!-- Desktop navigation -->
      <div class="app-header-nav desktop-only">
        <a href="admin.html" id="nav-desktop-list" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">名單</a>
        <a href="group.html" class="bottom-nav-item active" style="flex: none; flex-direction: row; gap: 4px;">分組</a>
        <a href="seminar.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">座談會</a>
        <a href="lineage.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">靈線</a>
        <button onclick="signOut()" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; background: none; border: none;">登出</button>
      </div>
      <div style="width: 32px;"></div> <!-- Spacer -->
    </header>

    <div class="container py-4" style="max-width: 1000px;">
      <!-- Title area -->
      <div class="text-center mb-4 stagger-item">
        <h2 style="font-weight: 600; color: var(--text-main);">青年分組與活動登錄</h2>
        <p class="text-muted" style="font-size: 14px;">點擊成員以登錄或查看當月活動參與狀態</p>
      </div>

      <!-- Accordion Body -->
      <div class="accordion group-accordion stagger-item" style="animation-delay: 100ms;" id="body">
        <!-- Dynmically loaded group accordions -->
      </div>
    </div>

    <!-- Activity Logging Modal (logModal) -->
    <div class="modal fade" id="logModal" tabindex="-1" aria-labelledby="logModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card noise-overlay" style="border: none; padding: 25px;">
          <div class="modal-header border-0 pb-0">
            <div>
              <h5 class="modal-title" id="logModalLabel" style="font-weight: 600; color: var(--text-main); font-size: 20px;">成員姓名</h5>
              <div class="badge bg-warning text-dark mt-1" id="monthBadge" style="font-size: 12px; font-weight: 500;">當月份活動登錄</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-3">
            <h4 id="month" class="text-center d-none" style="font-weight: 600; color: var(--primary-dark);">當月月分</h4>
            
            <div class="list-group border-0 gap-2">
              <div class="list-group-item justify-content-between d-flex align-items-center py-3 px-3 border-0">
                <span style="font-weight: 500; font-size: 15px;">青年秀勉</span>
                <div class="d-flex gap-3">
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_a_yes" name="act_a" value="true" style="width: auto;">
                    <label class="form-check-label" for="act_a_yes">有</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_a_no" name="act_a" value="false" checked style="width: auto;">
                    <label class="form-check-label" for="act_a_no">無</label>
                  </div>
                </div>
              </div>

              <div class="list-group-item justify-content-between d-flex align-items-center py-3 px-3 border-0">
                <span style="font-weight: 500; font-size: 15px;">百淨靈</span>
                <div class="d-flex gap-3">
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_b_yes" name="act_b" value="true" style="width: auto;">
                    <label class="form-check-label" for="act_b_yes">有</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_b_no" name="act_b" value="false" checked style="width: auto;">
                    <label class="form-check-label" for="act_b_no">無</label>
                  </div>
                </div>
              </div>

              <div class="list-group-item justify-content-between d-flex align-items-center py-3 px-3 border-0">
                <span style="font-weight: 500; font-size: 15px;">淨靈週</span>
                <div class="d-flex gap-3">
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_c_yes" name="act_c" value="true" style="width: auto;">
                    <label class="form-check-label" for="act_c_yes">有</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_c_no" name="act_c" value="false" checked style="width: auto;">
                    <label class="form-check-label" for="act_c_no">無</label>
                  </div>
                </div>
              </div>

              <div class="list-group-item justify-content-between d-flex align-items-center py-3 px-3 border-0">
                <span style="font-weight: 500; font-size: 15px;">農場</span>
                <div class="d-flex gap-3">
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_d_yes" name="act_d" value="true" style="width: auto;">
                    <label class="form-check-label" for="act_d_yes">有</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_d_no" name="act_d" value="false" checked style="width: auto;">
                    <label class="form-check-label" for="act_d_no">無</label>
                  </div>
                </div>
              </div>

              <div class="list-group-item justify-content-between d-flex align-items-center py-3 px-3 border-0">
                <span style="font-weight: 500; font-size: 15px;">市集</span>
                <div class="d-flex gap-3">
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_e_yes" name="act_e" value="true" style="width: auto;">
                    <label class="form-check-label" for="act_e_yes">有</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_e_no" name="act_e" value="false" checked style="width: auto;">
                    <label class="form-check-label" for="act_e_no">無</label>
                  </div>
                </div>
              </div>

              <div class="list-group-item justify-content-between d-flex align-items-center py-3 px-3 border-0">
                <span style="font-weight: 500; font-size: 15px;">桃子活動</span>
                <div class="d-flex gap-3">
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_f_yes" name="act_f" value="true" style="width: auto;">
                    <label class="form-check-label" for="act_f_yes">有</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="form-check-input" type="radio" id="act_f_no" name="act_f" value="false" checked style="width: auto;">
                    <label class="form-check-label" for="act_f_no">無</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0 justify-content-end">
            <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">取消</button>
            <button id="btn_up" type="button" class="btn btn-primary-custom interactive" data-bs-dismiss="modal">
              更新紀錄
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation for Mobile -->
    <nav class="bottom-nav mobile-only">
      <a href="list.html" id="nav-mobile-list" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        <span>名單</span>
      </a>
      <a href="group.html" class="bottom-nav-item active">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>分組</span>
      </a>
      <a href="seminar.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        <span>座談會</span>
      </a>
      <a href="lineage.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.5 0 2.79-1.02 3-2.39L22.5 12 19 15.39c-.21-1.37-1.5-2.39-3-2.39-1.66 0-3 1.34-3 3s1.34 3 3 3c1.37 0 2.53-.93 2.87-2.18L24 12l-5.13-4.82C18.53 5.93 17.37 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zM2.87 14.82c-.34-1.25-1.5-2.18-2.87-2.18v-1.28c1.37 0 2.53-.93 2.87-2.18L8 12l-5.13 4.82zM12 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/></svg>
        <span>靈線</span>
      </a>
      <button onclick="signOut()" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span>登出</span>
      </button>
    </nav>

    <!-- Hidden elements for script compatibility -->
    <div style="display: none;">
      <div name="input-area"></div>
      <div id="staticBackdrop"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="/js/group.js"></script>
  </body>
</html>

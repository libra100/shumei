<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>青年部名單 - 唯讀模式</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffa100">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/logo.png" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <h1 class="app-title">
        <img onclick="this.classList.toggle('zoomed')" class="logo-zoomable" src="/logo.png" alt="Logo">
        <span>青年部名單</span>
      </h1>
      <!-- Desktop navigation -->
      <div class="app-header-nav desktop-only">
        <a href="list.html" class="bottom-nav-item active" style="flex: none; flex-direction: row; gap: 4px;">名單</a>
        <a href="group.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">分組</a>
        <a href="seminar.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">座談會</a>
        <a href="lineage.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">靈線</a>
        <a href="/farm/natural-farm.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; color: #52b788; font-weight: 600;">🌾 自然農法</a>
        <button onclick="signOut()" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; background: none; border: none;">登出</button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="btnClaimIdentity" class="btn btn-outline-light interactive" onclick="openClaimIdentityModal()" style="padding: 8px 16px; font-size: 14px; border: 1px solid rgba(255,255,255,0.2);">🔗 認領身份</button>
        <button class="btn btn-primary-custom interactive" onclick="excel()" style="padding: 8px 16px; font-size: 14px;">匯出 Excel</button>
      </div>
    </header>

    <!-- Query Password Overlay -->
    <div id="queryPasswordModal" class="query-pwd-overlay" style="display: none;">
      <div class="glass-card query-pwd-card text-center noise-overlay stagger-item">
        <h3>系統查詢驗證</h3>
        <p>請輸入查詢密碼以存取名單資料</p>
        <input type="password" id="queryPasswordInput" class="form-control" placeholder="請輸入密碼" style="margin-bottom: 20px; text-align: center;">
        <button class="btn btn-primary-custom interactive" style="width: 100%;" onclick="submitQueryPassword()">驗證密碼</button>
      </div>
    </div>

    <!-- Claim Identity Modal -->
    <div class="modal fade" id="claimIdentityModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card noise-overlay" style="border: 1px solid rgba(255,255,255,0.1);">
          <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
            <h5 class="modal-title">認領身份</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">選擇姓名</label>
              <select id="claimNameSelect" class="form-select" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                <option value="" disabled selected>請選擇您的名字</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">出生日期</label>
              <input type="date" id="claimBirthDate" class="form-control" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
            </div>
            <div class="mb-3">
              <label class="form-label">入信日期</label>
              <input type="date" id="claimJoinDate" class="form-control" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
            </div>
          </div>
          <div class="modal-footer" style="border-top: 1px solid rgba(255,255,255,0.1);">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary-custom interactive" onclick="submitClaimIdentity()">確認綁定</button>
          </div>
        </div>
      </div>
    </div>

    <div class="container-fluid py-4" style="width: 100%;">
      <!-- Search and Filter panel -->
      <div class="glass-card noise-overlay stagger-item">
        <div class="row g-3 align-items-center">
          <div class="col-12 col-md-6">
            <label class="form-label font-weight-bold" style="color: var(--text-main); font-weight: 600;">搜尋成員</label>
            <div class="input-group">
              <span class="input-group-text" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-right: none; border-radius: 10px 0 0 10px;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--text-main)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              </span>
              <input type="text" id="search-input" class="form-control" placeholder="輸入姓名、介紹人、電話、地址、備註..." style="border-left: none; border-radius: 0 10px 10px 0; background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--glass-border);" oninput="searchAll(this.value)">
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" style="color: var(--text-main); font-weight: 600;">依組長篩選</label>
            <select id="leader" class="form-select" onchange="getDate(this.value)" style="border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--glass-border);"></select>
          </div>
        </div>
      </div>

      <!-- Desktop View (Table) -->
      <div class="desktop-only glass-card noise-overlay stagger-item" style="animation-delay: 100ms; padding: 10px; overflow-x: auto;">
        <table class="table-glow" style="margin-bottom: 0;">
          <thead>
            <tr>
              <th scope="col" style="min-width: 110px;">入信日期</th>
              <th scope="col">姓名</th>
              <th scope="col">介紹人-1</th>
              <th scope="col">介紹人-2</th>
              <th scope="col">世話人</th>
              <th scope="col" style="min-width: 200px;">地址</th>
              <th scope="col" style="min-width: 110px;">市內電話</th>
              <th scope="col" style="min-width: 110px;">行動電話</th>
              <th scope="col" style="min-width: 110px;">出生日期</th>
              <th scope="col">組長</th>
              <th scope="col" style="min-width: 120px;">備註</th>
              <th scope="col">接觸</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>

      <!-- Mobile View (Card List) -->
      <div class="mobile-only" id="card-list"></div>
    </div>

    <!-- Bottom Navigation for Mobile -->
    <nav class="bottom-nav mobile-only">
      <a href="list.html" class="bottom-nav-item active">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        <span>名單</span>
      </a>
      <a href="group.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>分組</span>
      </a>
      <a href="seminar.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        <span>座談會</span>
      </a>
      <a href="lineage.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.5 0 2.79-1.02 3-2.39L22.5 12 19 15.39c-.21-1.37-1.5-2.39-3-2.39-1.66 0-3 1.34-3 3s1.34 3 3 3c1.37 0 2.53-.93 2.87-2.18L24 12l-5.13-4.82C18.53 5.93 17.37 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zM2.87 14.82c-.34-1.25-1.5-2.18-2.87-2.18v-1.28c1.37 0 2.53-.93 2.87-2.18L8 12l-5.13 4.82zM12 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/></svg>
        <span>靈線</span>
      </a>
      <button onclick="signOut()" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span>登出</span>
      </button>
    </nav>

    <!-- Hidden elements for script compatibility if any -->
    <div style="display: none;">
      <select id="set_lead"></select>
      <select id="list_part"></select>
      <div class="write"></div>
      <div id="log_foot"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="/js/list.js"></script>
  </body>
</html>

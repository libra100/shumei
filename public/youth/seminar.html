<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登記座談會 - 青年部系統</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffa100">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="秀明青年">
    <link rel="icon" href="/logo.png" type="image/png">
    <script src="/js/pwa.js" defer></script>
                        
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/app.css">
    <style>
      .btn-add-float {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        color: white;
        border: none;
        box-shadow: 0 4px 15px rgba(255, 161, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        z-index: 999;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <h1 class="app-title">
        <img onclick="this.classList.toggle('zoomed')" class="logo-zoomable" src="/logo.png" alt="Logo">
        <span>座談會紀錄</span>
      </h1>
      <!-- Desktop navigation -->
      <div class="app-header-nav desktop-only">
        <a href="dashboard.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">總覽</a>
        <a href="list.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">名單</a>
        <a href="group.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">分組</a>
        <a href="seminar.html" class="bottom-nav-item active" style="flex: none; flex-direction: row; gap: 4px;">座談會</a>
        <a href="lineage.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">靈線</a>
        <a href="/farm/natural-farm.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; color: #52b788; font-weight: 600;">🌾 自然農法</a>
        <button onclick="signOut()" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; background: none; border: none;">登出</button>
      </div>
      <div>
        <button class="btn btn-primary-custom interactive" onclick="prepareAddSeminar()" style="padding: 8px 16px; font-size: 14px;">登記座談會</button>
      </div>
    </header>

    <!-- Floating Action Button for mobile adding -->
    <button class="btn-add-float mobile-only interactive" onclick="prepareAddSeminar()">+</button>

    <div class="container py-2 py-md-3 px-2 px-md-3" style="max-width: 800px;">
      <!-- Title area (Compact) -->
      <div class="text-center mb-2 mb-md-3 stagger-item">
        <h2 style="font-weight: 600; color: var(--text-main); font-size: 1.15rem; margin-bottom: 2px;">座談會參與歷程</h2>
        <p class="text-muted" style="font-size: 12px; margin-bottom: 0;">登錄青年在座談會中的時間、地點、當下感受與信仰提升目標</p>
      </div>

      <!-- Search filter (Compact) -->
      <div class="glass-card noise-overlay stagger-item p-2 mb-2 mb-md-3">
        <div class="row g-2 align-items-center">
          <div class="col-12">
            <div class="input-group input-group-sm">
              <span class="input-group-text py-1 px-2" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); border-right: none; border-radius: 8px 0 0 8px;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="var(--text-main)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              </span>
              <input type="text" id="search-seminar" class="form-control py-1 px-2" placeholder="搜尋姓名、地點、當下感受或目標..." style="border-left: none; border-radius: 0 8px 8px 0; background: rgba(255,255,255,0.05); color: var(--text-main); font-size: 13px; border: 1px solid var(--glass-border);" oninput="searchSeminars(this.value)">
            </div>
          </div>
        </div>
      </div>

      <!-- Timeline list -->
      <div class="timeline" id="timeline-list">
        <!-- Dynamically loaded timeline items -->
        <div class="text-center py-5 text-muted stagger-item" id="loading-placeholder">
          <div class="spinner-border text-warning mb-2" role="status"></div>
          <div>讀取座談會資料中...</div>
        </div>
      </div>
    </div>

    <!-- Register Seminar Modal -->
    <div class="modal fade" id="registerSeminarModal" tabindex="-1" aria-labelledby="registerSeminarModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card noise-overlay" style="border: none; padding: 25px;">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title" id="registerSeminarModalLabel" style="font-weight: 600; color: var(--text-main);">登記座談會紀錄</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-3">
            <form id="seminar-form" onsubmit="submitSeminar(event)">
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label" style="font-weight: 600;">選擇組長</label>
                  <select id="sem_leader" class="form-select" onchange="filterMembersByLeader()" style="border-radius: 10px;">
                    <option value="" disabled selected>載入中...</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label" style="font-weight: 600;">選擇青年成員</label>
                  <select id="sem_member" class="form-select" required style="border-radius: 10px;">
                    <option value="" disabled selected>載入中...</option>
                  </select>
                </div>
              </div>
              
              <div id="ai-input-section" class="mb-3">
                <label class="form-label" style="font-weight: 600;">座談會紀錄內容</label>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">請貼上包含時間、地點、感受、目標等資訊的文字，系統將自動識別並建立紀錄</p>
                <textarea id="ai-raw-input" class="form-control" placeholder="例如：\n3/15 下午2點在台北支部\n感受：心中很平靜\n目標：每天早晚誦御禱\n參加者：小明" rows="6" style="font-size: 13px;" oninput="autoSelectMember(this.value)"></textarea>
              </div>

              <!-- Structured Fields (Only for Edit Mode) -->
              <div id="structured-fields" style="display: none;">
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label class="form-label" style="font-weight: 600;">座談會日期</label>
                    <input type="date" id="sem_date" class="form-control">
                  </div>
                  <div class="col-6">
                    <label class="form-label" style="font-weight: 600;">時間</label>
                    <input type="time" id="sem_time" class="form-control">
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label" style="font-weight: 600;">舉辦地點</label>
                  <input type="text" id="sem_location" class="form-control" placeholder="輸入地點，例如：台北支部">
                </div>
                <div class="mb-3">
                  <label class="form-label" style="font-weight: 600;">當下的感受</label>
                  <textarea id="sem_feelings" class="form-control" placeholder="紀錄當下的感想、淨靈體驗、或是心中的喜悅..." rows="3"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label" style="font-weight: 600;">信仰提升的目標（內容）</label>
                  <textarea id="sem_goals" class="form-control" placeholder="設定個人提升的目標或紀錄座談內容..." rows="3"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label" style="font-weight: 600;">參加者</label>
                  <textarea id="sem_attendees" class="form-control" placeholder="列出其他參加的人員..." rows="2"></textarea>
                </div>
              </div>

              <div class="modal-footer border-0 pt-0 justify-content-end px-0">
                <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary-custom interactive" id="seminar-submit-btn">
                  確認登錄
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation for Mobile -->
    <nav class="bottom-nav mobile-only">
      <a href="dashboard.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>總覽</span>
      </a>
      <a href="list.html" id="nav-mobile-list" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        <span>名單</span>
      </a>
      <a href="group.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>分組</span>
      </a>
      <a href="seminar.html" class="bottom-nav-item active">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        <span>座談會</span>
      </a>
      <a href="lineage.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.5 0 2.79-1.02 3-2.39L22.5 12 19 15.39c-.21-1.37-1.5-2.39-3-2.39-1.66 0-3 1.34-3 3s1.34 3 3 3c1.37 0 2.53-.93 2.87-2.18L24 12l-5.13-4.82C18.53 5.93 17.37 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zM2.87 14.82c-.34-1.25-1.5-2.18-2.87-2.18v-1.28c1.37 0 2.53-.93 2.87-2.18L8 12l-5.13 4.82zM12 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/></svg>
        <span>靈線</span>
      </a>
      <button onclick="signOut()" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span>登出</span>
      </button>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="/js/seminar.js"></script>
  </body>
</html>

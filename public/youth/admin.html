<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>青年部名單 - 管理員模式</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffa100">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="秀明青年">
    <link rel="icon" href="/logo.png" type="image/png">
    <script src="/js/pwa.js" defer></script>
                        
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
      .btn-add-float {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        color: white;
        border: none;
        box-shadow: 0 4px 15px rgba(255, 161, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        z-index: 999;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <h1 class="app-title">
        <img onclick="this.classList.toggle('zoomed')" class="logo-zoomable" src="/logo.png" alt="Logo">
        <span>青年部名單 (管理)</span>
      </h1>
      <!-- Desktop navigation -->
      <div class="app-header-nav desktop-only">
        <a href="dashboard.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">總覽</a>
        <a href="admin.html" class="bottom-nav-item active" style="flex: none; flex-direction: row; gap: 4px;">名單</a>
        <a href="group.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">分組</a>
        <a href="seminar.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">座談會</a>
        <a href="lineage.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px;">靈線</a>
        <a href="/farm/natural-farm.html" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; color: #52b788; font-weight: 600;">🌾 自然農法</a>
        <button onclick="signOut()" class="bottom-nav-item" style="flex: none; flex-direction: row; gap: 4px; background: none; border: none;">登出</button>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-secondary-custom interactive" onclick="excel()" style="padding: 8px 12px; font-size: 14px;">匯出 Excel</button>
        <button class="btn btn-primary-custom interactive" data-bs-toggle="modal" data-bs-target="#addMemberModal" style="padding: 8px 14px; font-size: 14px; white-space: nowrap;">
          <span class="desktop-only">新增成員</span>
          <span class="mobile-only">＋新增</span>
        </button>
      </div>
    </header>

    <!-- Query Password Overlay -->
    <div id="queryPasswordModal" class="query-pwd-overlay" style="display: none;">
      <div class="glass-card query-pwd-card text-center noise-overlay stagger-item">
        <h3>系統查詢驗證</h3>
        <p>請輸入查詢密碼以存取名單資料</p>
        <input type="password" id="queryPasswordInput" class="form-control" placeholder="請輸入密碼" style="margin-bottom: 20px; text-align: center;">
        <button class="btn btn-primary-custom interactive" style="width: 100%;" onclick="submitQueryPassword()">驗證密碼</button>
      </div>
    </div>

    <!-- Floating Action Button for mobile adding -->
    <button class="btn-add-float mobile-only interactive" data-bs-toggle="modal" data-bs-target="#addMemberModal" aria-label="新增成員" title="新增成員">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>

    <div class="container-fluid py-2 py-md-3 px-2 px-md-3" style="width: 100%;">
      <!-- Search and Filter panel (Compact Toolbar) -->
      <div class="glass-card noise-overlay stagger-item p-2 p-md-3 mb-2 mb-md-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-5">
            <div class="input-group input-group-sm">
              <span class="input-group-text py-1 px-2" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); border-right: none; border-radius: 8px 0 0 8px;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="var(--text-main)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              </span>
              <input type="text" id="search-input" class="form-control py-1 px-2" placeholder="搜尋姓名、電話、地址、備註..." style="border-left: none; border-radius: 0 8px 8px 0; background: rgba(255,255,255,0.05); color: var(--text-main); font-size: 13px; border: 1px solid var(--glass-border);" oninput="searchAll(this.value)">
            </div>
          </div>
          <div class="col-7 col-md-4">
            <select id="leader" class="form-select form-select-sm py-1 px-2" onchange="getDate(this.value)" style="border-radius: 8px; background: rgba(255,255,255,0.05); color: var(--text-main); font-size: 13px; border: 1px solid var(--glass-border);"></select>
          </div>
          <div class="col-5 col-md-3 d-flex justify-content-end">
            <button type="button" class="btn btn-sm btn-outline-secondary w-100 py-1" onclick="toggleAllCards()" id="btnToggleAll" style="font-size: 12px; border-radius: 8px; color: var(--text-muted); border-color: var(--glass-border);">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="margin-right: 4px; vertical-align: -2px;"><path d="M12 5.83L15.17 9l1.41-1.41L12 3 7.41 7.59 8.83 9 12 5.83zm0 12.34L8.83 15l-1.41 1.41L12 21l4.59-4.59L15.17 15 12 18.17z"/></svg>展開全部
            </button>
          </div>
        </div>
      </div>

      <!-- Desktop View (Table) -->
      <div class="desktop-only glass-card noise-overlay stagger-item" style="animation-delay: 100ms; padding: 6px; overflow-x: auto; max-height: calc(100vh - 160px); overflow-y: auto;">
        <table class="table-glow" style="margin-bottom: 0;">
          <thead>
            <tr>
              <th scope="col" style="min-width: 110px;">入信日期</th>
              <th scope="col">姓名</th>
              <th scope="col">介紹人-1</th>
              <th scope="col">介紹人-2</th>
              <th scope="col">世話人</th>
              <th scope="col" style="min-width: 200px;">地址</th>
              <th scope="col" style="min-width: 110px;">市內電話</th>
              <th scope="col" style="min-width: 110px;">行動電話</th>
              <th scope="col" style="min-width: 110px;">出生日期</th>
              <th scope="col">組長</th>
              <th scope="col" style="min-width: 120px;">備註</th>
              <th scope="col">接觸</th>
              <th scope="col">編輯</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>

      <!-- Mobile View (Card List) -->
      <div class="mobile-only" id="card-list"></div>
    </div>

    <!-- Add Member Modal -->
    <div class="modal fade" id="addMemberModal" tabindex="-1" aria-labelledby="addMemberModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content glass-card noise-overlay" style="border: none; padding: 25px;">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title" id="addMemberModalLabel" style="font-weight: 600; color: var(--text-main);">新增成員資料</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label">入信日期</label>
                <input type="date" id="join" class="form-control">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">姓名</label>
                <input type="text" id="name" class="form-control" placeholder="請輸入姓名">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">介紹人 1</label>
                <input type="text" id="guide1" class="form-control" placeholder="請輸入介紹人 1">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">介紹人 2</label>
                <input type="text" id="guide2" class="form-control" placeholder="請輸入介紹人 2">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">世話人</label>
                <input type="text" id="sewajin" class="form-control" placeholder="請輸入世話人">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">出生日期</label>
                <input type="date" id="born" class="form-control">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">市內電話</label>
                <input type="tel" id="tel" class="form-control" placeholder="請輸入市內電話">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">行動電話</label>
                <input type="phone" id="phone" class="form-control" placeholder="請輸入行動電話">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">分組組長</label>
                <select id="leader_add" class="form-select" style="border-radius: 10px;"></select>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">是否可接觸</label>
                <div class="d-flex gap-4 mt-2">
                  <div>
                    <input type="radio" id="cnt_yes" name="connect" checked style="width: auto; margin-right: 6px;">
                    <label for="cnt_yes">可接觸</label>
                  </div>
                  <div>
                    <input type="radio" id="cnt_no" name="connect" style="width: auto; margin-right: 6px;">
                    <label for="cnt_no">不可接觸</label>
                  </div>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">通訊地址</label>
                <input type="text" id="adress" class="form-control" placeholder="請輸入通訊地址">
              </div>
              <div class="col-12">
                <label class="form-label">備註</label>
                <textarea id="note" class="form-control" placeholder="輸入備註，如：世話人、助教師..." rows="2"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0 pt-3">
            <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary-custom interactive" data-bs-dismiss="modal" id="btn_upload">上傳儲存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Member Modal (setModal) -->
    <div class="modal fade" id="setModal" tabindex="-1" aria-labelledby="ModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card noise-overlay" style="border: none; padding: 25px;">
          <div class="modal-header border-0 pb-0 justify-content-between align-items-center">
            <div>
              <h5 class="modal-title" id="ModalTitle" style="font-weight: 600; color: var(--text-main);">修改資料</h5>
            </div>
            <div class="d-flex align-items-center gap-2">
              <select id="list_part" class="form-select py-1 px-3" style="width: auto; font-size: 13px; border-radius: 8px;">
                <option disabled>部署</option>
                <option value="青年部">青年部</option>
                <option value="大學生">大學生</option>
                <option value="男子部">男子部</option>
              </select>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
          </div>
          <div class="modal-body py-3">
            <div class="mb-3">
              <label class="form-label">世話人</label>
              <input type="text" class="form-control" id="set_sewa">
            </div>
            <div class="mb-3">
              <label class="form-label">通訊地址</label>
              <input type="text" class="form-control" id="set_adress">
            </div>
            <div class="mb-3">
              <label class="form-label">市內電話</label>
              <input type="tel" class="form-control" id="set_tel">
            </div>
            <div class="mb-3">
              <label class="form-label">行動電話</label>
              <input type="phone" class="form-control" id="set_phone">
            </div>
            <div class="mb-3">
              <label class="form-label">組長</label>
              <select class="form-select" id="set_lead" style="border-radius: 10px;"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">備註</label>
              <input type="text" class="form-control" id="set_note">
            </div>
            <div class="mb-1">
              <label class="form-label d-block">是否可接觸</label>
              <div class="d-flex gap-4 mt-1">
                <div>
                  <input type="radio" id="set_cnt_y" name="conect" style="width: auto; margin-right: 6px;">
                  <label for="set_cnt_y">可接觸</label>
                </div>
                <div>
                  <input type="radio" id="set_cnt_n" name="conect" style="width: auto; margin-right: 6px;">
                  <label for="set_cnt_n">不可接觸</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0 d-flex justify-content-between">
            <button type="button" class="btn btn-danger interactive" data-bs-dismiss="modal" id="btn_del" style="padding: 10px 20px; border-radius: 10px;">
              刪除資料
            </button>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-secondary-custom interactive" data-bs-dismiss="modal">取消</button>
              <button type="button" class="btn btn-primary-custom interactive" data-bs-dismiss="modal" id="btn_up">
                更新儲存
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation for Mobile -->
    <nav class="bottom-nav mobile-only">
      <a href="dashboard.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>總覽</span>
      </a>
      <a href="admin.html" class="bottom-nav-item active">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        <span>名單</span>
      </a>
      <a href="group.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>分組</span>
      </a>
      <a href="seminar.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        <span>座談會</span>
      </a>
      <a href="lineage.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.5 0 2.79-1.02 3-2.39L22.5 12 19 15.39c-.21-1.37-1.5-2.39-3-2.39-1.66 0-3 1.34-3 3s1.34 3 3 3c1.37 0 2.53-.93 2.87-2.18L24 12l-5.13-4.82C18.53 5.93 17.37 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zM2.87 14.82c-.34-1.25-1.5-2.18-2.87-2.18v-1.28c1.37 0 2.53-.93 2.87-2.18L8 12l-5.13 4.82zM12 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/></svg>
        <span>靈線</span>
      </a>
      <button onclick="signOut()" class="bottom-nav-item">
        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span>登出</span>
      </button>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>

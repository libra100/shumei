<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>神慈秀明會 - 青年名單系統</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffa100">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="秀明青年">
    <link rel="icon" href="/logo.png" type="image/png">
    <script src="/js/pwa.js" defer></script>
    <!-- PWA settings -->
                        
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/app.css">

    <style>
      .login-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 90vh;
      }
      .login-card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 40px 30px;
        border-radius: 24px;
        animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .app-logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 20px auto;
        display: block;
        filter: drop-shadow(0 6px 12px rgba(255, 161, 0, 0.25));
        transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .app-logo:hover {
        transform: rotate(360deg) scale(1.08);
      }
      .login-card h1 {
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-main);
      }
      .login-subtitle {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 35px;
      }
      .login-btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .google-logo {
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        padding: 2px;
      }
      .loading-spinner {
        display: none;
        margin-top: 15px;
        font-size: 14px;
        color: var(--primary-dark);
        font-weight: 500;
      }
      .loading-spinner .spinner-border {
        width: 1.2rem;
        height: 1.2rem;
        vertical-align: text-bottom;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container login-page">
      <div class="glass-card login-card noise-overlay">
        <img onclick="this.classList.toggle('zoomed')" class="logo-zoomable app-logo stagger-item" src="./logo.png" alt="Shumei Logo">
        <h1 class="stagger-item" style="animation-delay: 50ms;">秀明青年名單系統</h1>
        <p class="login-subtitle stagger-item" style="animation-delay: 100ms;">請選擇登入身分以繼續使用</p>

        <div class="stagger-item" style="animation-delay: 150ms;">
          <button class="btn btn-primary-custom login-btn interactive" onclick="signInWithGoogle()">
            <svg class="google-logo" viewBox="0 0 24 24" width="24" height="24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-.1.14-.1.14-1.14 2.27-3.48 3.82-6.59 3.82-4.11 0-7.46-3.35-7.46-7.46s3.35-7.46 7.46-7.46c1.88 0 3.6.7 4.93 1.86l2.79-2.79C17.91 2.1 15.11 1 12 1 5.92 1 1 5.92 1 12s4.92 11 11 11c6.33 0 11.23-5.11 11.75-11.27z"/>
            </svg>
            Google 登入 (幹部 / 世話人)
          </button>
        </div>

        <div class="stagger-item" style="animation-delay: 200ms;">
          <button class="btn btn-secondary-custom login-btn interactive" onclick="signInAsGuest('member')" style="background: var(--primary-light); color: var(--primary-dark); border-color: rgba(255, 161, 0, 0.3);">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-right: 2px;">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
            </svg>
            密碼登入 (一般成員)
          </button>
        </div>

        <div class="d-flex gap-2 stagger-item mt-3 pt-3 border-top border-secondary border-opacity-25" style="animation-delay: 220ms;">
          <a href="/activities/events.html" class="btn btn-outline-warning w-50 py-2 rounded-pill interactive small" style="font-size: 13px;">
            <i class="fa-solid fa-calendar-check me-1"></i>活動與研修
          </a>
          <a href="/activities/jyorei.html" class="btn btn-outline-info w-50 py-2 rounded-pill interactive small" style="font-size: 13px;">
            <i class="fa-solid fa-sun me-1"></i>淨靈打卡
          </a>
        </div>

        <div class="d-flex gap-2 stagger-item mt-2" style="animation-delay: 235ms;">
          <a href="/scheduling/" class="btn btn-warning w-50 py-2 rounded-pill interactive font-weight-bold shadow-sm" style="font-size: 13px; background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; border: none;">
            <i class="fa-solid fa-calendar-days me-1"></i>值班排程
          </a>
          <a href="/scheduling/front.html" class="btn btn-primary-custom w-50 py-2 rounded-pill interactive font-weight-bold shadow-sm" style="font-size: 13px;">
            <i class="fa-solid fa-tablet-screen-button me-1"></i>現場櫃檯
          </a>
        </div>

        <div id="loading" class="loading-spinner stagger-item" style="animation-delay: 250ms;">
          <div class="spinner-border text-warning" role="status"></div>
          登入中，請稍候...
        </div>
      </div>
    </div>

    <!-- Firebase compatibility libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    <script src="./js/index.js"></script>

    <!-- Register Service Worker -->
    
  </body>
</html>

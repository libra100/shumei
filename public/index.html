<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>神慈秀明會 - 青年名單系統</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffa100">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="秀明青年">
    <link rel="icon" href="/logo.png" type="image/png">
    <script src="/js/pwa.js" defer></script>
    <!-- PWA settings -->
                        
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/app.css">

    <style>
      .login-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 90vh;
        padding: 20px 12px;
      }
      .login-card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        padding: 40px 24px;
        border-radius: 28px;
        animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .app-logo {
        width: 86px;
        height: 86px;
        margin: 0 auto 16px auto;
        display: block;
        filter: drop-shadow(0 6px 16px rgba(255, 161, 0, 0.3));
        transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .app-logo:hover {
        transform: rotate(360deg) scale(1.08);
      }
      .login-card h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 6px;
        color: var(--text-main);
        letter-spacing: 0.5px;
      }
      .login-subtitle {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 30px;
      }

      /* Role Selection Cards */
      .role-card-btn {
        width: 100%;
        padding: 18px 20px;
        border-radius: 16px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        text-decoration: none !important;
        border: 1px solid var(--glass-border);
        background: var(--glass-bg);
        transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .role-card-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }
      .role-card-btn:active {
        transform: scale(0.98);
        filter: brightness(1.1);
        border-color: #00F3FF;
        box-shadow: 0 0 14px rgba(0, 243, 255, 0.4);
      }

      /* Member Card Specific (Warm Emerald/Gold Accent) */
      .role-card-member {
        border-color: rgba(16, 185, 129, 0.35);
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(10, 15, 30, 0.6) 100%);
      }
      .role-card-member:hover {
        border-color: #10b981;
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
      }
      .role-card-member .role-icon-box {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
      }

      /* Leader Card Specific (Tech Cyan/Blue Accent) */
      .role-card-leader {
        border-color: rgba(0, 243, 255, 0.35);
        background: linear-gradient(135deg, rgba(0, 243, 255, 0.08) 0%, rgba(10, 15, 30, 0.6) 100%);
      }
      .role-card-leader:hover {
        border-color: #00F3FF;
        box-shadow: 0 8px 24px rgba(0, 243, 255, 0.2);
      }
      .role-card-leader .role-icon-box {
        background: rgba(0, 243, 255, 0.15);
        color: #00F3FF;
      }

      .role-icon-box {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
      }
      .role-content {
        flex: 1;
        text-align: left;
      }
      .role-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .role-desc {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 3px;
      }
      .role-arrow {
        color: var(--text-muted);
        font-size: 18px;
        transition: transform 0.2s ease;
      }
      .role-card-btn:hover .role-arrow {
        transform: translateX(4px);
        color: var(--text-main);
      }

      .role-badge {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(0, 243, 255, 0.15);
        color: #00F3FF;
        font-weight: 500;
        border: 1px solid rgba(0, 243, 255, 0.3);
      }

      .footer-links {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .footer-links a {
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .footer-links a:hover {
        color: var(--primary-color);
      }

      .google-icon {
        width: 22px;
        height: 22px;
      }

      .loading-spinner {
        display: none;
        margin-top: 18px;
        font-size: 14px;
        color: var(--primary-color);
        font-weight: 500;
      }
      .loading-spinner .spinner-border {
        width: 1.2rem;
        height: 1.2rem;
        vertical-align: text-bottom;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container login-page">
      <div class="glass-card login-card noise-overlay">
        <img onclick="this.classList.toggle('zoomed')" class="logo-zoomable app-logo stagger-item" src="./logo.png" alt="Shumei Logo">
        <h1 class="stagger-item" style="animation-delay: 50ms;">神慈秀明會</h1>
        <p class="login-subtitle stagger-item" style="animation-delay: 100ms;">青年活動與值班系統</p>

        <!-- 身分一：一般信徒 (主要報名活動) -->
        <div class="stagger-item" style="animation-delay: 150ms;">
          <button class="role-card-btn role-card-member interactive" onclick="signInAsGuest('member')">
            <div class="role-icon-box">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
              </svg>
            </div>
            <div class="role-content">
              <div class="role-title">一般信徒</div>
              <div class="role-desc">活動報名 • 每月工作意願 • 個人排程</div>
            </div>
            <div class="role-arrow">→</div>
          </button>
        </div>

        <!-- 身分二：小組長 (含世話人) -->
        <div class="stagger-item" style="animation-delay: 200ms;">
          <button class="role-card-btn role-card-leader interactive" onclick="signInWithGoogle()">
            <div class="role-icon-box" style="background: white;">
              <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-.1.14-.1.14-1.14 2.27-3.48 3.82-6.59 3.82-4.11 0-7.46-3.35-7.46-7.46s3.35-7.46 7.46-7.46c1.88 0 3.6.7 4.93 1.86l2.79-2.79C17.91 2.1 15.11 1 12 1 5.92 1 1 5.92 1 1 5.92 1 12s4.92 11 11 11c6.33 0 11.23-5.11 11.75-11.27z"/>
              </svg>
            </div>
            <div class="role-content">
              <div class="role-title">
                小組長
                <span class="role-badge">含世話人</span>
              </div>
              <div class="role-desc">Google 登入 • 名單、座談會與總覽管理</div>
            </div>
            <div class="role-arrow">→</div>
          </button>
        </div>

        <!-- 輔助公開功能捷徑 (低調簡潔，不搶主畫面) -->
        <div class="footer-links stagger-item" style="animation-delay: 250ms;">
          <a href="/scheduling/front.html">現場櫃檯</a>
          <span>•</span>
          <a href="/activities/jyorei.html">淨靈打卡</a>
          <span>•</span>
          <a href="/farm/natural-farm.html">自然農法</a>
        </div>

        <div id="loading" class="loading-spinner stagger-item" style="animation-delay: 280ms;">
          <div class="spinner-border text-info" role="status"></div>
          登入中，請稍候...
        </div>
      </div>
    </div>

    <!-- Firebase compatibility libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    <script src="./js/index.js"></script>

    <!-- Register Service Worker -->
    
  </body>
</html>
